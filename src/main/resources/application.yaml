spring:
  profiles.active: ${SPRING_ACTIVE_PROFILE:dev}
  application:
    name: ${SPRING_APP_NAME:user-service}

  threads:
    virtual:
      enabled: true

  jackson:
    mapper:
      accept-case-insensitive-properties: true

  datasource:
    username: ${SPRING_DATASOURCE_USERNAME:user_service}
    password: ${SPRING_DATASOURCE_PASSWORD:user_service}
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_service}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    defer-datasource-initialization: false
    properties:
      hibernate:
        show_sql: ${SPRING_JPA_HIBERNATE_SHOW_SQL:false}
        format_sql: ${SPRING_JPA_HIBERNATE_FORMAT_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    sql-migration-prefix: V
    repeatable-sql-migration-prefix: R
    sql-migration-separator: __
    sql-migration-suffixes: .sql

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/company-platform}

server:
  port: ${SERVER_PORT:9121}

iam:
  keycloak:
    admin:
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
      realm: ${KEYCLOAK_REALM:company-platform}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    operationsSorter: method
  show-actuator: true

logging:
  level:
    root: ${ROOT_LOG_LEVEL:info}
    org:
      hibernate: info
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:info}
  pattern:
    level: ${LOG_PATTERN_CONSOLE:%green(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %blue(-%5level) %red([%thread]) %magenta(---){faint} %yellow(%logger{15}) - %msg%n}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,threaddump
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true
      mode: full
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: "User lifecycle service backed by Keycloak"
