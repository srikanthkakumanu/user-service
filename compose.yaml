services:
  postgres:
    image: postgres:18
    container_name: user-service-postgres
    restart: on-failure
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ../micro-services/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: user-service-keycloak
    restart: on-failure
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: theuser
      KC_DB_PASSWORD: theuser
      KC_HEALTH_ENABLED: true

  user-service:
    image: user-service:latest
    build:
      context: .
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "9121:9121"
    environment:
      SPRING_APP_NAME: user-service
      SERVER_PORT: 9121
      SPRING_DATASOURCE_USERNAME: theuser
      SPRING_DATASOURCE_PASSWORD: theuser
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_FLYWAY_USER: useradmin
      SPRING_FLYWAY_PASSWORD: useradmin
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_HIBERNATE_SHOW_SQL: false
      SPRING_JPA_HIBERNATE_FORMAT_SQL: false
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/company-platform
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: company-platform
      KEYCLOAK_ADMIN_CLIENT_ID: user-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: change-me
      ROOT_LOG_LEVEL: info

volumes:
  postgres:
    driver: local
